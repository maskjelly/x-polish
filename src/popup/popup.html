<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>X Polish</h1>
      <span class="version" id="version"></span>
    </div>
    <label class="switch" title="Turn X Polish on or off">
      <input type="checkbox" role="switch" id="master" aria-label="Enable X Polish" />
      <span aria-hidden="true"></span>
    </label>
  </header>

  <main id="toggles"></main>

  <section class="group" id="people" aria-labelledby="people-title">
    <h2 id="people-title">My labels <span class="count" id="people-count"></span></h2>
    <div class="card">
      <div class="empty" id="people-empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.6V4.5C3 3.67 3.67 3 4.5 3h8.1c.4 0 .78.16 1.06.44l7.4 7.4a1.5 1.5 0 0 1 0 2.12l-8.1 8.1a1.5 1.5 0 0 1-2.12 0l-7.4-7.4A1.5 1.5 0 0 1 3 12.6Z"/><circle cx="8" cy="8" r="1.6"/></svg>
        <p>No labels yet. Hover a post and click the tag icon next to the name to give someone a colour and tag.</p>
      </div>
      <ul id="people-list"></ul>
    </div>
  </section>

  <section class="group" id="shield" aria-labelledby="shield-title">
    <h2 id="shield-title">Spoiler shield words <span class="count" id="shield-count"></span></h2>
    <div class="card">
      <form class="shield-add" id="shield-form" autocomplete="off">
        <input id="shield-input" type="text" maxlength="40" placeholder="Add a word or phrase" aria-label="Word or phrase to hide" />
        <button type="submit" id="shield-add-btn">Add</button>
      </form>
      <p class="shield-hint" id="shield-hint" aria-live="polite"></p>
      <div class="empty" id="shield-empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c5 0 8.6 4.3 9.6 6.2a1.7 1.7 0 0 1 0 1.6 15 15 0 0 1-3.1 3.9M6.3 6.4A15.2 15.2 0 0 0 2.4 11.2a1.7 1.7 0 0 0 0 1.6C3.4 14.7 7 19 12 19a9.6 9.6 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        <p>Posts mentioning these words are blurred until you click Show. Try a team, a show or a topic you're tired of.</p>
      </div>
      <ul id="shield-list" class="chips"></ul>
    </div>
  </section>

  <script src="../settings.js"></script>
  <script src="../labels.js"></script>
  <script src="popup.js"></script>
</body>
</html>
